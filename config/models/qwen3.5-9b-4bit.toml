# Configuration for Qwen3.5-9B on Apple Silicon (MLX)
# Model: mlx-community/Qwen3.5-9B-MLX-4bit
# Platform: Apple Silicon (M1/M2/M3/M4)
# Backend: MLX

[model]
model_id = "mlx-community/Qwen3.5-9B-MLX-4bit"
backend = "mlx"
n_layers = 48
n_kv_heads = 4
head_dim = 128

[inference]
temperature = 0.7
top_p = 0.95
top_k = 40
repetition_penalty = 1.0
extended_thinking = false
supports_thinking = true

[optimal]
max_batch_size = 2
kv_bits = 4
kv_group_size = 64
block_tokens = 256
cache_budget_mb = 8192
prefill_step_size = 256

max_agents_in_memory = 8
evict_to_disk = true

[thresholds]
long_context_threshold = 8000
high_batch_threshold = 2
memory_pressure_mb = 16384
min_cache_benefit_ratio = 0.8
