# Qwen 3.5 27B Opus-Distilled on NVIDIA Jetson AGX Thor
# Dense model: fine-tuned distillation of larger model reasoning
# Backend: llama.cpp (llama-server, managed by agent-memory)
#
# Best for: strong reasoning with Qwen 3.5 architecture, tool calling,
# coding tasks. Dense 27B — all parameters active per token.

[model]
model_id = "qwen35-opus-distilled"
backend = "llamacpp"
n_layers = 28
n_kv_heads = 4
head_dim = 128
kv_format = "fp"

[inference]
temperature = 0.7
top_p = 0.95
top_k = 40
extended_thinking = false
supports_thinking = true

[optimal]
max_batch_size = 2
block_tokens = 256
cache_budget_mb = 32768
max_agents_in_memory = 4
evict_to_disk = true

[llamacpp]
gguf_path = "~/models/qwen35-opus-distilled/Qwen3.5-27B.Q4_K_M.gguf"
tokenizer_id = "Qwen/Qwen3.5-27B"
ctx_size = 131072
n_slots = 2
n_gpu_layers = 99
extra_args = ["--jinja", "-fa", "on"]
