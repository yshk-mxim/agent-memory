# Gemma 4 31B (Dense) on NVIDIA Jetson AGX Thor
# Deep reasoning model: full 31B params active per token
# Backend: llama.cpp (llama-server, managed by agent-memory)
#
# Performance (Thor sm_110, 228 GB/s, Q4_K_M + E2B Q3 speculative decoding):
#   Without spec decode:  8.7 t/s (think ON)  |  8.9 t/s (think OFF)
#   With E2B Q3 draft:   15.4 t/s (think ON)  | 18.7 t/s (think OFF)
#   Speedup:              1.76x                |  2.10x
#   Draft acceptance:     ~57% (think ON)      | ~51% (think OFF)
#   Prefill pp512: 361 t/s
#
# Speculative decoding uses Gemma 4 E2B (2B dense, Q3_K_XL, 2.8 GB) as
# draft model. The draft generates 4 candidate tokens per cycle; the
# main 31B model verifies in a single forward pass.
#
# --draft 4 (not 16): Real-world agent workloads with tool schemas show
# ~40% acceptance rate (vs 57% on clean benchmarks). At p=0.40, expected
# accepted tokens ≈ 1.65 regardless of draft window size (geometric series
# converges fast when p < 0.5). --draft 4 gets the same benefit with 4x
# less draft overhead → net ~1.3-1.4x speedup vs baseline.
#
# The 26B-A4B MoE model is too fast (51 t/s) to benefit from spec decode.
#
# Best for: complex architectural reasoning, security audits,
# contract review, multi-file refactors — tasks where maximum
# reasoning depth per token justifies the speed penalty vs MoE.

[model]
model_id = "gemma-4-31b"
backend = "llamacpp"
n_layers = 48
n_kv_heads = 16
head_dim = 88
kv_format = "fp"

[inference]
temperature = 0.7
top_p = 0.95
top_k = 64
extended_thinking = true
supports_thinking = true

[optimal]
max_batch_size = 2
block_tokens = 256
cache_budget_mb = 32768
max_agents_in_memory = 4
evict_to_disk = true

[llamacpp]
gguf_path = "~/models/gemma4-31b/gemma-4-31B-it-Q4_K_M.gguf"
tokenizer_id = "google/gemma-4-31B-it"
ctx_size = 131072     # Full 131K — peak VRAM ~74GB (31B+E2B weights + both KV caches + 32GB agent memory cache), fits in 128GB unified; agent caches evict to disk under pressure
n_slots = 1           # 1 slot with spec decode (draft model occupies GPU alongside main)
n_gpu_layers = 99
extra_args = [
    "--reasoning", "auto", "--reasoning-format", "deepseek", "-fa", "on",
    "--model-draft", "~/models/gemma4-e2b/gemma-4-E2B-it-UD-Q3_K_XL.gguf",
    "--gpu-layers-draft", "99",
    "--draft", "4",
]
chat_template_file = "config/chat_templates/gemma4-26b-merged.jinja"  # Interleaved template: preserves reasoning between tool calls, better for agentic loops
